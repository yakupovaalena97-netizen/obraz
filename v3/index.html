<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Obraz v3 — путеводитель по выставкам">
<meta property="og:description" content="Три хода: погода, узор, карта. Твой путь по выставкам Москвы, в том числе по Пушкинской карте. Ничего не хранится.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E0E10'/%3E%3Crect x='7' y='9' width='18' height='4' fill='%23F29AC4'/%3E%3Crect x='9' y='15' width='18' height='4' fill='%2321CFC2'/%3E%3Crect x='7' y='21' width='18' height='4' fill='%23EDECE7'/%3E%3C/svg%3E">
<title>Путеводитель Obraz v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Цифровой путеводитель по выставкам Москвы: три хода игры и путь по выставкам, в том числе по Пушкинской карте.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=Unbounded:wght@300;500&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Oranienbaum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: плакатная стена на чёрном. Под обрез, одна колонка экранов, которые меняются на месте.
   Правила из плакатов Алёны: целого нет (срезы), буква как картинка, цифровой сбой, фактура вместо заливки, всё движется, кислотный цвет на чёрном.
   Розовый = тепло, бирюза = холод: цвет работает как смысл, а не как украшение. Один осознанный тёмный вид для всех тем. */
:root{
  color-scheme:dark;
  --bg:#000000;        /* поле плаката */
  --panel:#0C0B10;     /* подложка блоков схемы */
  --fg:#F2EEF4;        /* текст, тёплый белый с лиловым */
  --mute:#9C95A6;      /* подписи */
  --rule:#2C2833;      /* линии */
  --cyan:#00E6DA;      /* холод */
  --pink:#F4C2E4;      /* тепло */
  --red:#F5321E;       /* сбой, приводка */
  --violet:#A968C2;    /* ночь */
  --display:"Oswald","Arial Narrow",sans-serif;
  --body:"Golos Text",system-ui,sans-serif;
  --wide:"Unbounded",Arial,sans-serif;
  --serif:"Playfair Display",Georgia,serif;
}
*{box-sizing:border-box}
html{background:var(--bg);padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--cyan)}
img,canvas{max-width:100%}
p{margin:0;max-width:64ch}
h1,h2,h3{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.92;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(46px,8.6vw,120px)}
h2{font-size:clamp(34px,5.4vw,66px)}
h3{font-size:clamp(22px,2.6vw,30px);line-height:1}
.lab{font:300 11px/1.35 var(--wide);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}.small{font-size:14px}
.split{text-shadow:-3px 0 var(--red),3px 0 var(--cyan)}
/* срез заголовка: две одинаковые копии в одной ячейке сетки, верхняя видна полосой и сдвинута */
.cut{display:inline-grid;text-shadow:-3px 0 var(--red),3px 0 var(--cyan)}
.cut>span{grid-area:1/1}
.cut>.cb{clip-path:inset(47% 0 37% 0);transform:translateX(.06em);background:var(--bg);text-shadow:-4px 0 var(--cyan),4px 0 var(--red)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* шапка */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--rule);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px 22px;padding-block:12px;flex-wrap:wrap}
.logo{font:700 24px/1 var(--display);letter-spacing:.04em;color:var(--fg);background:none;border:0;padding:0;cursor:pointer;text-shadow:-2px 0 var(--red),2px 0 var(--cyan)}
nav#nav{display:flex;gap:4px 16px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
nav#nav button{font:300 11px/1 var(--wide);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);background:none;border:0;padding:8px 0;cursor:pointer;white-space:nowrap}
nav#nav button.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--cyan)}
nav#nav button:disabled{opacity:.35;cursor:default}
nav#nav button:not(:disabled):hover{color:var(--fg)}
.pkt{display:flex;align-items:center;gap:10px;font:300 11px/1.2 var(--wide);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);background:none;border:1px solid var(--rule);padding:7px 10px;cursor:pointer;white-space:nowrap}
.pkt i{width:26px;height:14px;border:1px solid var(--mute);position:relative;flex:none}
.pkt i::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;background:var(--mute);transition:left .2s}
.pkt[aria-pressed="true"]{border-color:var(--pink)}
.pkt[aria-pressed="true"] i{border-color:var(--pink)}
.pkt[aria-pressed="true"] i::after{left:14px;background:var(--pink)}

main.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:72px;padding-top:40px}

/* кнопки и поля */
button,.btn{font:600 15px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:14px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button:hover,.btn:hover{background:var(--cyan);border-color:var(--cyan)}
button.ghost{background:transparent;color:var(--fg);border-color:var(--rule)}
button.ghost:hover{border-color:var(--fg);background:transparent}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{background:var(--fg);border-color:var(--fg)}
button.ghost:disabled:hover{background:transparent;border-color:var(--rule)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
input[type=text]{font:400 17px var(--body);background:transparent;color:var(--fg);border:0;border-bottom:1px solid var(--mute);padding:10px 0;width:100%;max-width:420px}
input[type=text]:focus{outline:none;border-color:var(--cyan)}
.slider{width:100%;max-width:560px;accent-color:var(--pink);height:28px}
.chip{font:300 11px/1 var(--wide);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);padding:8px 10px;color:var(--fg);display:inline-block}
.chip.w{border-color:var(--pink);color:var(--pink)}.chip.c{border-color:var(--cyan);color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{background:transparent;color:var(--mute);border:1px solid var(--rule);font:300 11px/1 var(--wide);letter-spacing:.12em;padding:11px 14px}
.seg button.sel{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.seg button:hover{border-color:var(--fg)}

/* главная */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.hero .art{position:relative;min-width:0}
.hero .art img{display:block;width:100%;height:auto}
.three{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule)}
.three>div{padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;border-right:1px solid var(--rule)}
.three>div:last-child{border-right:0}
.three b{font:600 24px/1 var(--display);text-transform:uppercase}
.three .lab b{font:inherit}
.three.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pkband{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;border:1px solid var(--pink);padding:24px}
.agg{display:flex;flex-wrap:wrap;gap:8px 22px;font:300 11px/1.3 var(--wide);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.agg i{display:inline-block;width:7px;height:7px;background:var(--cyan);margin-right:8px;vertical-align:1px}

/* игра */
.game{display:flex;flex-direction:column;gap:20px;max-width:880px}
.turn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px}.dots i{width:42px;height:4px;background:var(--rule)}.dots i.on{background:var(--cyan)}
.q{font:600 clamp(28px,4.4vw,48px)/1 var(--display);text-transform:uppercase;text-wrap:balance}
.got{border-left:2px solid var(--cyan);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px;min-height:58px}
.got .lab{color:var(--cyan)}
.padwrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:28px;align-items:start}
.pad{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pad .h,.pad .v{position:absolute;background:var(--fg);pointer-events:none;mix-blend-mode:difference}
.pad .h{left:0;right:0;height:1px}.pad .v{top:0;bottom:0;width:1px}
.pad .m{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--fg);background:var(--bg);pointer-events:none;box-shadow:-3px 0 0 var(--red),3px 0 0 var(--cyan)}
.pad .e{position:absolute;font:300 10px/1 var(--wide);letter-spacing:.16em;text-transform:uppercase;color:var(--fg);background:var(--bg);padding:5px 6px;pointer-events:none}
.pad .e.l{left:0;top:50%;transform:translateY(-50%)}.pad .e.r{right:0;top:50%;transform:translateY(-50%)}
.pad .e.t{top:0;left:50%;transform:translateX(-50%)}.pad .e.b{bottom:0;left:50%;transform:translateX(-50%)}
.wx{font:700 clamp(54px,8vw,104px)/.9 var(--display);text-transform:uppercase;text-shadow:-3px 0 var(--red),3px 0 var(--cyan);word-break:break-word}
.board{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:28px;align-items:start}
.board canvas{width:100%;height:auto;display:block;background:var(--bg)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{padding:0;background:var(--bg);border:1px solid var(--rule);display:block}
.opt:hover{background:var(--bg);border-color:var(--fg)}
.opt.sel{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan)}
.opt canvas{display:block;width:100%;height:auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:760px}
.card{padding:0;background:var(--bg);border:1px solid var(--rule);display:flex;flex-direction:column;gap:0;align-items:stretch;text-align:left;color:var(--fg);transition:transform .2s}
.card:hover{background:var(--bg);border-color:var(--fg)}
.card img{display:block;width:100%;height:auto}
.card span{font:italic 400 19px/1.2 var(--serif);text-transform:none;letter-spacing:0;padding:12px 12px 14px}
.card.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink);transform:translateY(-6px)}
.card.dim{opacity:.45}
.phrase{font:italic 400 clamp(26px,3.4vw,40px)/1.1 var(--serif)}
.ends{display:flex;justify-content:space-between;gap:16px;max-width:560px;font:300 11px/1.3 var(--wide);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ends span:last-child{text-align:right}
.shuffle{min-height:50vh;display:grid;place-items:center;font:700 clamp(40px,7vw,90px)/1 var(--display);text-transform:uppercase}

/* путь */
.pathgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:44px;align-items:start}
.cardimg{width:100%;height:auto;display:block;background:var(--panel);aspect-ratio:2/3}
.reads{display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--rule)}
.reads>div{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1.3fr);gap:14px;padding:14px 16px;border-bottom:1px solid var(--rule);align-items:baseline}
.reads>div:last-child{border-bottom:0}
.reads b{font:600 18px/1.1 var(--display);text-transform:uppercase}
details summary{cursor:pointer;font:300 11px/1.3 var(--wide);letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.axes{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ax{display:grid;grid-template-columns:100px minmax(0,1fr) 100px;gap:10px;align-items:center;font:300 10px/1.2 var(--wide);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ax span:last-child{text-align:right}
.ax .t{position:relative;height:16px;border-bottom:1px solid var(--rule)}
.ax .t b{position:absolute;bottom:-5px;transform:translateX(-50%);background:var(--cyan)}
.ax .t b.o2{background:var(--pink)}.ax .t b.o3{background:var(--fg)}.ax .t b.o4{background:var(--violet)}

/* остановки */
.stops{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.stop{display:grid;grid-template-columns:48px 150px minmax(0,1fr);gap:22px;padding:22px 0;border-bottom:1px solid var(--rule);align-items:start}
.stop .n{font:700 34px/1 var(--display);color:var(--mute)}
.stop .tx{display:flex;flex-direction:column;gap:8px;min-width:0}
.stop h3 button,.thumb{all:unset;cursor:pointer;font:inherit;text-transform:inherit;display:block}
.thumb:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.stop h3 button:hover{color:var(--cyan)}
.stop h3 button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.whys{display:flex;flex-direction:column;gap:4px;font-size:15px}
.whys span b{font:300 10px/1 var(--wide);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-right:8px}
.pct{font:500 13px/1 var(--wide);letter-spacing:.06em;color:var(--fg)}
.frag{position:relative;display:block;width:100%;aspect-ratio:1/1;max-width:100%;overflow:hidden;background:var(--panel)}
.frag img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.frag .ph{position:absolute;left:0;bottom:0;font:300 9px/1 var(--wide);letter-spacing:.12em;text-transform:uppercase;background:var(--bg);color:var(--mute);padding:5px 6px}
.pk{font:300 10px/1.2 var(--wide);letter-spacing:.12em;text-transform:uppercase;color:var(--pink);display:inline-flex;align-items:center;gap:7px}
.pk i{width:9px;height:9px;background:var(--pink);display:inline-block}
.note{border:1px solid var(--pink);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* выставка, билет, приглашение, аудиогид */
.ex{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:44px;align-items:start}
.ex h2{font-size:clamp(30px,3.8vw,50px);line-height:.95}
.why{border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:10px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days button{background:transparent;color:var(--fg);border:1px solid var(--rule);font:500 14px/1 var(--body);text-transform:none;letter-spacing:0;padding:11px 12px}
.days button.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qty{display:flex;align-items:center;gap:14px}
.reward{border:1px solid var(--cyan);padding:20px;display:flex;flex-direction:column;gap:10px}
.gift{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:44px;align-items:start}
.gift img{width:100%;height:auto;display:block;background:var(--panel)}
.guide{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.trk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.trk.on .nm{color:var(--cyan)}
.trk .play{padding:10px 13px}
.prog{height:2px;background:var(--rule);margin-top:8px}.prog i{display:block;height:100%;width:0;background:var(--cyan)}
.lyr{font:italic 400 21px/1.35 var(--serif);padding:16px 0}
.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;border:1px solid var(--rule);padding:18px}
.qr{background:#FFFFFF;padding:8px;width:146px;min-height:146px;display:grid;place-items:center}
.wins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:760px}
.win{padding:0;background:var(--bg);border:1px solid var(--rule);display:flex;flex-direction:column;align-items:stretch;gap:0;color:var(--mute)}
.win:hover{background:var(--bg);border-color:var(--fg)}
.win>span:last-child{font:300 10px/1 var(--wide);letter-spacing:.14em;padding:10px}

/* как это работает */
.how{display:flex;flex-direction:column;gap:56px;max-width:1180px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.flow>div{position:relative;background:var(--panel);border:1px solid var(--rule);padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.flow>div+div{border-left:0}
.flow>div:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:16px;z-index:1;font:600 20px/1 var(--display);color:var(--cyan);background:var(--bg);padding:2px 3px}
.flow .lab{color:var(--cyan)}
.flow b{font:600 20px/1.05 var(--display);text-transform:uppercase}
.flow .you{border-top:1px dashed var(--rule);padding-top:8px;margin-top:auto;font-size:14px;color:var(--pink)}
.move{display:flex;flex-direction:column;gap:14px}
.move h3 small{font:300 11px/1 var(--wide);letter-spacing:.14em;color:var(--mute);margin-left:10px;vertical-align:middle}
.formula{font:500 15px/1.7 var(--wide);letter-spacing:.02em;border:1px solid var(--rule);padding:18px;overflow-x:auto}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.lit{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.lit li::marker{font:600 13px var(--display);color:var(--cyan)}
footer{border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:10px;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font:600 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;z-index:20}

@media (max-width:900px){
  .hero,.pathgrid,.ex,.gift,.padwrap,.board,.cols2{grid-template-columns:minmax(0,1fr)}
  .three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three>div:nth-child(2){border-right:0}
  .three>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .three.t3{grid-template-columns:minmax(0,1fr)}
  .three.t3>div{border-right:0;border-bottom:1px solid var(--rule)}
  .three.t3>div:last-child{border-bottom:0}
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow>div+div{border-left:1px solid var(--rule);border-top:0}
  .flow>div:not(:last-child)::after{content:"↓";right:auto;left:18px;top:auto;bottom:-13px}
  .flow>div{padding-bottom:24px}
  .pkband{grid-template-columns:minmax(0,1fr)}
  .stop{grid-template-columns:96px minmax(0,1fr);gap:16px}
  .stop .n{display:none}
  .stop .frag .ph{display:none}
  header.top{position:static}
  .share{grid-template-columns:minmax(0,1fr)}
  .reads>div{grid-template-columns:minmax(0,1fr);gap:4px}
  main.wrap{gap:56px;padding-top:28px}
}
@media (max-width:520px){
  nav#nav{flex-wrap:wrap;overflow:visible;flex-basis:100%;gap:2px 16px}
  .three{grid-template-columns:minmax(0,1fr)}
  .three>div{border-right:0;border-bottom:1px solid var(--rule)}
  .three>div:last-child{border-bottom:0}
  .opts,.cards,.wins{gap:8px}
  .card span{font-size:15px;padding:8px}
  .ax{grid-template-columns:70px minmax(0,1fr) 70px}
  .dots i{width:26px}
}

const R = {};

// WOMAN: фото «фасада» в движении → крупный 1-битный дизеринг → огромное слово поперёк, белым.
R.bitType = (ctx, { word = 'ОБРАЗ', seed = 11 } = {}) => {
  const [w, h] = size(ctx), r = rnd(seed);
  ctx.fillStyle = '#d8d8d8'; ctx.fillRect(0, 0, w, h);
  let y = 0;
  while (y < h) {
    const rh = 45 + r() * 80, skew = (r() - .5) * 70, light = 160 + r() * 70;
    const gr = ctx.createLinearGradient(0, y, w, y + rh); gr.addColorStop(0, `rgb(${light},${light},${light})`); gr.addColorStop(1, `rgb(${light - 70},${light - 70},${light - 70})`);
    ctx.fillStyle = gr; ctx.fillRect(0, y, w, rh);
    let x = -40;
    while (x < w + 40) {
      const tw = 40 + r() * 110, gap = 10 + r() * 45, tone = 8 + r() * 45 + (r() < .2 ? 70 : 0);
      ctx.fillStyle = `rgb(${tone},${tone},${tone})`;
      ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + tw, y + 4 + r() * 6); ctx.lineTo(x + tw + skew * .5, y + rh - 4); ctx.lineTo(x + skew * .5, y + rh - 4); ctx.fill();

  dither(ctx, { algo: 'floyd', scale: 3, gamma: 1.1 });
  fitText(ctx, word, { font: '"Montserrat"', weight: 600, x: w * .06, y: -h * .01, w: w * .88, h: h * 1.02, rotate: -Math.PI / 2, fill: PAL.white });
};

// WOMAN в цвете: датамош-фон, слово в три полупрозрачных слоя, муаровые кольца.

    fitText(ctx, word, { font: '"Montserrat"', weight: 600, x: w * x0, y: h * (i % 2 ? .015 : -.01), w: w * ww, h, rotate: -Math.PI / 2, fill: c, alpha: a }));

// Бах: сетка плиток, в каждой одна и та же звуковая волна в своей палитре.

  const [w, h] = size(ctx), r = rnd(seed), n = noise(seed);
  const pals = [[PAL.ultramarine, PAL.acid, PAL.aqua, '#06240A', PAL.acid], [PAL.magenta, '#24C5DD', '#E3221B', '#2A0B3A', PAL.magenta], ['#3B1747', '#78497F', '#B389BC', '#F2E6F5'], ['#E938CC', '#B388F0', '#F7E04A', '#F5A3E5'], ['#05030A', '#2A0B3A', '#E21BDB', '#24C5DD']];

};

// Штрихи: узор из «Ф» → жидкая деформация → два цвета (бирюза/чёрный) → розовые лезвия мелком,
// сквозь которые виден тот же узор в красном.

  warp(b, { amp: 7, freq: .035, noiseAmp: 55, noiseFreq: .01, twirl: 1.6, seed });
  const cy = canvas(w, h), c = cy.getContext('2d'); c.drawImage(base, 0, 0); duotone(c, { dark: PAL.black, light: PAL.cyan, threshold: 120 });

// Падающая типографика на белом.
R.falling = (ctx, { line = 'Найди свой путь', drop = [2, 7, 12], extras = '&ё’оаи&рт', pileGlyphs = '&ПАт&ы', seed = 51 } = {}) => fallingType(ctx, { line, drop, extras, pileGlyphs, seed });

// Волна: «вода» из шума → карта цвета → светящиеся контуры → радуга по краям → растр → текст узкой антиквой.

  tg.save(); tg.translate(ix + w * .03, iy + ih - h * .06); tg.scale(.78, 1.45); tg.fillText(title, 0, 0); tg.restore();

// Космос: туманность из шума, кольцо света, город, отражение, росчерки, разведение каналов, растр, узкий гротеск.
R.space = (ctx, { top = ['МЫ ИЩЕМ КОСМОС', 'ЧТОБЫ НАЙТИ МАСШТАБ СЕБЯ'], kicker = 'НЕВОЗМОЖНОЕ СТАЛО', title = 'ВОЗМОЖНЫМ', seed = 71 } = {}) => {

  const map = [hex(PAL.night), hex(PAL.dusk), hex(PAL.plum), hex('#6B2C72'), hex(PAL.violet), hex(PAL.rose), hex(PAL.mist), hex('#E9F2E4')];

  // город по краям
  for (let side = 0; side < 2; side++) for (let k = 0; k < 34; k++) {
    const bw = 5 + r() * 22, bh = 30 + Math.pow(r(), 1.6) * h * .38, bx = side ? w - Math.pow(r(), 1.5) * w * .38 - bw : Math.pow(r(), 1.5) * w * .38;
    ctx.fillStyle = `rgba(${10 + r() * 30},${8 + r() * 14},${24 + r() * 40},.9)`; ctx.fillRect(bx, horizon - bh, bw, bh);
    for (let q = 0; q < bh / 4; q++) if (r() < .35) { ctx.fillStyle = [PAL.magenta, PAL.aqua, '#9DFF7A', '#F2E6F5', PAL.violet, '#FF6FD8'][(r() * 6) | 0]; ctx.fillRect(bx + r() * bw, horizon - bh + q * 4, 1 + r() * 2, 1 + r() * 2); }
  }

  for (let y = 0; y < H2; y++) { const sy = H2 - 1 - y, off = Math.round(Math.sin(y * .5) * (2 + y * .04)); for (let x = 0; x < w; x++) { const sx = clamp(x + off, 0, w - 1), i = (y * w + x) * 4, j = (sy * w + sx) * 4, k = .8 * (1 - y / H2 * .6); b[i] = a[j] * k; b[i + 1] = a[j + 1] * k; b[i + 2] = a[j + 2] * k; b[i + 3] = 255; } }

  slices(ctx, { n: 50, max: 14, prob: .35, dir: 'h', seed: seed + 2 });
  rgbSplit(ctx, { dx: 4 });
  halftone(ctx, { cell: 7, angle: 45, mix: .35 });

  tg.globalCompositeOperation = 'source-atop'; tg.globalAlpha = .22; tg.drawImage(ctx.canvas, 0, 0); tg.globalAlpha = 1;
  halftone(tg, { cell: 6, angle: 45, mix: .45, color: '#5a2a73', invert: true });
  tg.globalCompositeOperation = 'source-over';

  ctx.drawImage(tc, 0, 0);
  ctx.fillStyle = '#F1ECF4'; ctx.font = `600 ${w * .045}px "Oswald"`; ctx.textAlign = 'right'; ctx.fillText(kicker, w * .92, h * .6);
  ctx.textAlign = 'left'; ctx.font = `300 ${w * .02}px "Unbounded"`; ctx.fillStyle = '#E8E4EE';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
  ctx.fillText(top[0], w * .07, h * .05); ctx.textAlign = 'right'; ctx.fillText(top[1], w * .93, h * .05); ctx.textAlign = 'left';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

function padCanvas(){
  if(CACHE.pad)return CACHE.pad;
  const N=400,c=OS.canvas(N,N),g=c.getContext('2d'),id=g.createImageData(N,N),d=id.data;
  const cold=[0,230,218],mid=[227,209,238],warm=[244,194,228],hot=[245,50,30],night=[60,32,69],lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const tx=x/(N-1)*2-1,ty=1-y/(N-1)*2;
    let col=tx<0?lerp(mid,cold,-tx):tx<.5?lerp(mid,warm,tx*2):lerp(warm,hot,(tx-.5)*2);
    if(ty<0)col=lerp(col,night,-ty*.55);

// узор из плиток Кооса: 0 фон, 1 цвет, 2–5 треугольник в углу (лв, пв, пн, лн), 8 акцент, 9 плитка из четырёх мелких
function kohsCode(L,i,j,seed){
  const r=rng(seed*7919+i*131+j*17+L*100003);
  switch(L){
    case 0:return i%2?0:1;
    case 1:return (i+j)%2?1:2;
    case 2:return[4,5,3,2][(i%2)*2+(j%2)];
    case 3:{const v=r();return v<.18?0:v<.3?1:v<.38?8:2+Math.floor(r()*4)}
    default:{const v=r();return v<.5?9:v<.62?8:2+Math.floor(r()*4)}
  }
}
function drawTile(g,code,x,y,s,C,r){
  g.fillStyle=C.bg;g.fillRect(x,y,s+.5,s+.5);
  if(code===0)return;
  const col=code===8?C.ac:C.fg;
  if(code===1||code===8){g.fillStyle=col;g.fillRect(x,y,s+.5,s+.5);return}
  if(code===9){const h=s/2;for(let a=0;a<2;a++)for(let b=0;b<2;b++)drawTile(g,2+Math.floor(r()*4),x+b*h,y+a*h,h,{bg:C.bg,fg:r()<.35?C.ac:C.fg,ac:C.ac},r);return}
  const X0=x,Y0=y,X1=x+s+.5,Y1=y+s+.5;g.fillStyle=col;g.beginPath();
  if(code===2){g.moveTo(X0,Y0);g.lineTo(X1,Y0);g.lineTo(X0,Y1)}
  if(code===3){g.moveTo(X0,Y0);g.lineTo(X1,Y0);g.lineTo(X1,Y1)}
  if(code===4){g.moveTo(X1,Y0);g.lineTo(X1,Y1);g.lineTo(X0,Y1)}
  if(code===5){g.moveTo(X0,Y0);g.lineTo(X1,Y1);g.lineTo(X0,Y1)}
  g.closePath();g.fill();
}

// кусок узора: клетки с row0/col0 по n штук, уровень L; одинаковый уровень с полем даёт бесшовное продолжение
function drawPiece(g,ox,oy,s,rd,L,row0,col0,n,C){
  const seed=rd*10+L+1;
  for(let a=0;a<n;a++)for(let b=0;b<n;b++){const i=row0+a,j=col0+b;drawTile(g,kohsCode(L,i,j,seed),ox+b*s,oy+a*s,s,C,rng(seed*31+i*7+j))}
  if(L>=4)glitchRegion(g,ox,oy,n*s,n*s,6,s*.35,rng(seed+99));
}

  if(B>=4)glitchRegion(g,0,0,N,N,6,s*.3,rng(rd));
  const x0=(G-gp)*s;
  if(L==null){g.fillStyle=C.bg;g.fillRect(x0,x0,gp*s,gp*s);g.setLineDash([8,8]);g.strokeStyle=MUTE;g.lineWidth=2;g.strokeRect(x0+6,x0+6,gp*s-12,gp*s-12);g.setLineDash([]);

/* ======================= как ходы становятся подборкой ======================= */
const avg=a=>a.reduce((s,v)=>s+v,0)/(a.length||1);
const patC=M=>{const v=(M.pat||[]).filter(x=>x!=null);return v.length?avg(v):0};
// профиль из ходов: каждая ось берётся из своего хода, вес = 0,3 + 1,2·|значение хода|, у осей без хода 0,15
function prof(M){
  const p=Array(D).fill(0),w=Array(D).fill(.15),c=patC(M),wc=.3+1.2*Math.abs(c);
  p[0]=M.x;w[0]=.3+1.2*Math.abs(M.x);
  p[2]=M.y;w[2]=.3+1.2*Math.abs(M.y);
  p[4]=c;w[4]=wc;p[6]=.5*c;w[6]=.6*wc;p[5]=-.4*c;w[5]=.4*wc;
  (M.ref||[]).forEach((k,n)=>{if(k==null)return;const x=exById(WINDOWS[n].ids[k]).x;for(let i=0;i<D;i++)p[i]+=.2*(x[i]-p[i])});
  return{p,w,c};
}
// совпадение по цвету и узору — формула Алёны: exp(−0,2·Σ w(x−p)²)
const vis=(e,P)=>Math.exp(-.2*e.x.reduce((a,v,k)=>a+P.w[k]*(v-P.p[k])**2,0));
// оценка = 0,6·совпадение + 0,25·мотив + 0,15·знакомое или новое
function score(e,M){const P=prof(M),v=vis(e,P),mo=e.m[M.m]||0,nv=1-Math.abs(M.o-e.f);return{v,mo,nv,s:.6*v+.25*mo+.15*nv}}
const isNew=e=>{const d=(TODAY-new Date(e.from))/864e5;return d>=-21&&d<=21};
// вместе: min по участникам − 0,25 за повтор площадки + 0,05 за новую выставку
function rank(ms,pkOnly){
  const left=EX.filter(e=>!pkOnly||PK[e.id]).map(e=>{const prs=ms.map(M=>score(e,M).s);return{e,prs,pr:Math.min(...prs),nov:isNew(e)?1:0}});
  const out=[],seen={};
  while(left.length){left.forEach(o=>{o.rep=seen[o.e.g]||0;o.sc=o.pr-.25*o.rep+.05*o.nov});left.sort((a,b)=>b.sc-a.sc);const o=left.shift();seen[o.e.g]=(seen[o.e.g]||0)+1;out.push(o)}
  return out;
}
// путь = погода (первое слово) + карта (куда ведёт); узор и знакомое говорят, каким путём
function pathOf(ms){
  const x=avg(ms.map(M=>M.x)),y=avg(ms.map(M=>M.y)),W=wxAt(x,y),m=ms.every(M=>M.m===ms[0].m)?ms[0].m:4;
  return{W,m,x,y,c:avg(ms.map(patC)),o:avg(ms.map(M=>M.o)),n:`${W.adj} путь ${MOT[m].dest}`};
}

const times=n=>n===1?'1 раз':n+' раза';
function patWord(M){const v=(M.pat||[]).filter(x=>x!=null),n=[0,1,2].map(k=>v.filter(x=>x===k-1).length);
  if(n[0]===3)return'все три раза проще';if(n[2]===3)return'все три раза сложнее';if(n[1]===3)return'все три раза в том же ритме';
  return[[n[0],'проще'],[n[1],'так же'],[n[2],'сложнее']].filter(a=>a[0]).map(a=>`${times(a[0])} ${a[1]}`).join(', ')}

const openBig=o=>o<.35?'Знакомое':o>.65?'Новое':'Поровну';

function effects(P){
  const pal=palTxt(P.x,P.y),pat=P.c<-.2?'где мало элементов и много воздуха':P.c>.2?'где плотно и много деталей':'со спокойной, но не пустой композицией';

}
// почему эта выставка: только те связи, которые есть на самом деле
function whyLines(e,ms){
  const P=pathOf(ms),out=[],w=[];
  if(Math.abs(P.x)>.25&&Math.sign(e.x[0])===Math.sign(P.x)&&Math.abs(e.x[0])>.15)w.push(P.x>0?'тёплая палитра':'прохладная палитра');
  if(Math.abs(P.y)>.25&&Math.sign(e.x[2])===Math.sign(P.y)&&Math.abs(e.x[2])>.15)w.push(P.y>0?'светлые тона':'тёмные тона');
  if(w.length)out.push({k:'Погода',ch:`«${P.W.n.toLowerCase()}»`,res:w.join(', ')});
  if(Math.abs(P.c)>.2&&Math.sign(e.x[4])===Math.sign(P.c)&&Math.abs(e.x[4])>.15)out.push({k:'Узор',ch:P.c<0?'проще':'сложнее',res:P.c<0?'мало элементов, много воздуха':'плотно, много деталей'});
  if(ms.every(M=>(e.m[M.m]||0)>=.5)){const same=ms.every(M=>M.m===ms[0].m);out.push(same?{k:'Карта',ch:`«${MOT[ms[0].m].card}»`,res:MOT[ms[0].m].ex}:{k:'Карты',ch:'всех',res:'подходит каждому по мотиву'})}
  if(P.o<.35&&e.f<=.4)out.push({k:'Знакомое',ch:'',res:'известные имена и классика'});
  if(P.o>.65&&e.f>=.6)out.push({k:'Новое',ch:'',res:'новые имена и форматы'});
  return out;
}

/* ======================= ссылки (ничего не хранится) ======================= */
// человек в ссылке = его ходы: погода x и y, три круга узора, карта, знакомое/новое, Пушкинская карта, два окна
const L21='abcdefghijklmnopqrstu';
const q21=v=>L21[Math.round((cl(v,-1,1)+1)*10)],u21=c=>L21.indexOf(c)/10-1;
const encM=M=>q21(M.x)+q21(M.y)+M.pat.map(v=>v==null?'x':String(v+1)).join('')+'abcde'[M.m]+q21(M.o*2-1)+(M.pk?'1':'0')+M.ref.map(v=>v==null?'x':String(v)).join('');
function decM(s){
  if(!s||s.length!==10)return null;const a=[...s];
  if(![a[0],a[1],a[6]].every(c=>L21.includes(c)))return null;const m='abcde'.indexOf(a[5]);if(m<0)return null;
  const pat=a.slice(2,5).map(c=>'012'.includes(c)?+c-1:null),ref=a.slice(8,10).map(c=>'012'.includes(c)?+c:null);
  return{x:u21(a[0]),y:u21(a[1]),pat,m,o:(u21(a[6])+1)/2,pk:a[7]==='1',ref};
}
const encName=n=>[...n.trim().slice(0,14)].map(c=>c.codePointAt(0).toString(36)).join('~');
const decName=s=>{try{return s?s.split('~').map(t=>String.fromCodePoint(parseInt(t,36))).join(''):''}catch(e){return''}};
const encPerson=o=>encM(o)+(o.name?'_'+encName(o.name):'');
const decPerson=t=>{const [a,b]=t.split('_'),M=decM(a);return M?Object.assign(M,{name:decName(b)}):null};

function finishGame(){
  const G=S.g,q=v=>Math.round(v*10)/10;
  S.me={x:q(G.x),y:q(G.y),pat:G.pat.slice(),m:G.m,o:Math.round(G.o*20)/20,pk:S.pk,ref:[null,null]};
  Object.assign(S,{viewOnly:false,fromLink:false,showAll:false});
}
function reveal(){
  finishGame();
  app.innerHTML=`<section class="shuffle">${cutSpan('Читаю ходы')}</section>`;
  setTimeout(()=>{if(S.screen!=='play')return;S.g=null;go(S.guests.length&&S.invite?'together':'path')},matchMedia('(prefers-reduced-motion: reduce)').matches?100:1200);
}

/* ---------- путь ---------- */
function axesHTML(ms){
  const ps=ms.map(prof),maxw=Math.max(...ps.flatMap(P=>P.w));
  return`<div class="axes">${AX.map((a,k)=>`<div class="ax"><span>${a.lo}</span><div class="t">${ps.map((P,i)=>{const sz=6+P.w[k]/maxw*10;return`<b class="${ps.length>1?'o'+(i%4+1):''}" style="left:${(cl(P.p[k],-1,1)+1)/2*100}%;width:${sz}px;height:${sz}px"></b>`}).join('')}</div><span>${a.hi}</span></div>`).join('')}</div>`;
}

    <div><span class="lab">Погода</span><b>${esc(wxAt(M.x,M.y).n)}</b><span>${cap(tempWord(M.x))}, ${weightWord(M.y)}</span></div>
    <div><span class="lab">Узор</span><b>${patBig(patC(M))}</b><span>${patWord(M)}</span></div>

      <div class="row"><button class="ghost" id="tog">Пойти вместе</button><button class="ghost" id="lnkb">Ссылка на мой путь</button><button class="ghost" id="re">Сыграть ещё раз</button></div>

function refine(){
  if(!S.me){go('home');return}
  const n=S.refStep,W=WINDOWS[n];
  app.innerHTML=`<section class="game"><div class="turn"><span class="lab">Уточнение · окно ${n+1} из 2 · необязательно</span></div>
    <p class="q">${W.q}</p><p class="mute">За каждым окном фрагмент работы с выставки, которая идёт сейчас. Названий нет, выбирай глазами. Каждое окно сдвигает вкус к выбранному фрагменту на 20%.</p>
    <div class="wins">${W.ids.map((id,j)=>`<button class="win" data-j="${j}"><span class="frag"><img src="${exImg(exById(id))}" alt="Фрагмент работы ${j+1}"></span><span>окно ${j+1}</span></button>`).join('')}</div>
    <div class="row"><button class="ghost" id="back">Назад к пути</button><button class="ghost" id="skip">Пропустить окно</button></div></section>`;
  const next=()=>{if(n<1){S.refStep=1;refine();window.scrollTo({top:0})}else{go('path');toast(S.me.ref.some(v=>v!=null)?'Путь уточнён':'Путь без изменений')}};
  app.querySelectorAll('.win').forEach(b=>b.onclick=()=>{S.me.ref[n]=+b.dataset.j;next()});
  document.getElementById('skip').onclick=next;
  document.getElementById('back').onclick=()=>go('path');
}
// карта пути 2:3: кусок поля погоды вокруг точки, полоса узора, сбой, название пути
function drawPathCard(ms,imgId){
  FONTS_READY.then(()=>{
    const W=1080,H=1620,c=OS.canvas(W,H),g=c.getContext('2d'),P=pathOf(ms),sd=seedOf(P.n+ms.map(encM).join());
    g.fillStyle=INK;g.fillRect(0,0,W,H);
    const AW=960,AH=860,art=OS.canvas(AW,AH),a=art.getContext('2d'),pc=padCanvas(),px=(P.x+1)/2*399,py=(1-P.y)/2*399,sw=150,sh=134;
    a.imageSmoothingEnabled=false;a.drawImage(pc,cl(px-sw/2,0,400-sw),cl(py-sh/2,0,400-sh),sw,sh,0,0,AW,AH);
    const C=patColors(P.x),L=cl(Math.round(2+2*P.c),0,4),s=80,rows=3,y0=AH-rows*s;
    for(let i=0;i<rows;i++)for(let j=0;j<AW/s;j++)drawTile(a,kohsCode(L,i,j,sd%997),j*s,y0+i*s,s,C,rng(sd+i*13+j));
    const cc=cardCanvas(P.m);a.save();a.translate(AW-300,70);a.rotate(.05);a.drawImage(cc,0,0,240,360);a.restore();
    OS.slices(a,{n:22,max:40,prob:.45,seed:sd%9973});OS.rgbSplit(a,{dx:4});
    g.drawImage(art,60,170);
    g.fillStyle=FG;g.font='300 24px Unbounded, sans-serif';spaced(g,4);g.fillText('OBRAZ · '+(ms.length>1?'ОБЩИЙ ПУТЬ':'ТВОЙ ПУТЬ'),60,112);
    g.textAlign='right';g.fillText('МОСКВА · 2026',W-60,112);g.textAlign='left';spaced(g,0);
    // название: узкий гротеск прописными, срез и разведение каналов
    const tc=OS.canvas(W,330),tg=tc.getContext('2d'),words=P.n.toUpperCase().split(' '),lines=[words.slice(0,2).join(' '),words.slice(2).join(' ')];
    const fs=Math.min(...lines.map(l=>fitFont(tg,l,700,'Oswald, sans-serif',W-120,150,60)));
    tg.font=`700 ${fs}px Oswald, sans-serif`;tg.fillStyle=FG;lines.forEach((l,i)=>tg.fillText(l,60,fs*.95+i*fs*.98));
    OS.slices(tg,{n:6,max:10,prob:.35,seed:sd%977});OS.rgbSplit(tg,{dx:4});
    g.drawImage(tc,0,1060);
    g.fillStyle=MUTE;g.font='300 22px Unbounded, sans-serif';spaced(g,3);
    const info=ms.length>1?[ms.map((M,i)=>(M.name||who(M,i))).join(' + ').toUpperCase().slice(0,44),'ПОГОДА '+P.W.n.toUpperCase()+' · УЗОР '+patBig(P.c).toUpperCase()]:
      ['ПОГОДА '+P.W.n.toUpperCase()+' · УЗОР '+patBig(P.c).toUpperCase(),'КАРТА '+MOT[P.m].card.toUpperCase()+' · '+openPct(P.o).toUpperCase()];
    info.forEach((t,i)=>g.fillText(t,60,1440+i*40));
    g.fillStyle=FG;g.fillRect(60,H-100,W-120,2);g.font='300 22px Unbounded, sans-serif';g.fillText('ПУТЕВОДИТЕЛЬ ПО ВЫСТАВКАМ',60,H-52);spaced(g,0);
    const img=document.getElementById(imgId);if(img)img.src=c.toDataURL('image/jpeg',.9);
  });
}

function stopRow(o,i,ms){
  const e=o.e,L=whyLines(e,ms),many=ms.length>1;
  const pct=many?o.prs.map((v,j)=>`${esc(who(ms[j],j))} ${Math.round(v*100)}%`).join(' · '):`совпадение ${Math.round(o.pr*100)}%`;
  return`<article class="stop"><span class="n">${String(i+1).padStart(2,'0')}</span>
    <button class="thumb" data-id="${e.id}" aria-label="Открыть: ${esc(e.t)}">${frag(e)}</button>
    <div class="tx"><span class="lab">${esc(e.v)} · ${esc(e.d)}${o.nov?' · новая':''}</span><h3><button data-id="${e.id}">${esc(e.t)}</button></h3>
      <span class="pct">${pct}</span>
      <div class="whys">${(L.length?L:[{k:'По сумме ходов',ch:'',res:'близко по цвету и форме'}]).map(l=>`<span><b>${l.k}${l.ch?' '+esc(l.ch):''}</b>${esc(l.res)}</span>`).join('')}</div>
      ${PK[e.id]?`<div class="row"><span class="pk"><i></i>Пушкинская карта · ${esc(e.p)}</span>${S.pk?`<a class="btn" href="${afisha(e)}" target="_blank" rel="noopener">Купить по Пушкинской карте&nbsp;↗</a>`:''}</div>`:''}
    </div></article>`;
}
function wireStops(){app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>go('ex',{ex:b.dataset.id,date:0,qty:1}))}
function segPk(){return`<div class="seg" role="group" aria-label="Какие выставки показывать"><button data-pk="0" class="${S.pk?'':'sel'}" aria-pressed="${!S.pk}">Все · ${EX.length}</button><button data-pk="1" class="${S.pk?'sel':''}" aria-pressed="${S.pk}">Пушкинская карта · ${npk}</button></div>`}
function wireSeg(after){app.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{const v=b.dataset.pk==='1';if(v!==S.pk)setPk(v);after()})}
function stops(){
  if(!S.me){go('home');return}
  const M=S.me,P=pathOf([M]),R=rank([M],S.pk),n=S.showAll?R.length:6;
  app.innerHTML=`<section class="stack" style="gap:24px">
    <div class="filters"><div class="stack" style="gap:10px"><p class="lab">${esc(P.n)}</p><h2>Остановки твоего пути</h2></div>${segPk()}</div>
    <div class="agg"><span><i></i>Порядок: от самой близкой к твоему пути</span><span>${S.pk?'только Пушкинская карта':'все выставки афиши'}</span><span>обновлено 16 октября</span></div>
    ${S.pk?pkNote(EX.length-npk):''}
    <div class="stops">${R.slice(0,n).map((o,i)=>stopRow(o,i,[M])).join('')}</div>
    <div class="row">${n<R.length?'<button class="ghost" id="more">Показать ещё остановки</button>':''}<button class="ghost" id="pth">Мой путь</button><button class="ghost" id="tog">Пойти вместе</button></div>
  </section>${foot()}`;
  wireStops();wireSeg(stops);
  document.getElementById('tog').onclick=()=>go('together');
  document.getElementById('pth').onclick=()=>go('path');
  const m=document.getElementById('more');if(m)m.onclick=()=>{S.showAll=true;stops()};
}

  app.innerHTML=`<section class="stack" style="gap:22px">
    <p class="lab">Вместе · ${G.length} ${G.length<5?'человека':'человек'}${S.pk?' · Пушкинская карта':''}</p>${cut('h2',P.n)}

      <div class="stack" style="gap:16px">
        <div class="reads">${G.map((M,i)=>`<div><span class="lab">${esc(names[i])}</span><b>${esc(pathOf([M]).n)}</b><span>${esc(wxAt(M.x,M.y).n.toLowerCase())}, узор ${patBig(patC(M)).toLowerCase()}, карта «${MOT[M.m].card}»</span></div>`).join('')}</div>

        `<div class="row"><button id="back">Отправить общий путь обратно</button>${G.length<MAXP?'<button class="ghost" id="add">Позвать ещё человека</button>':''}</div>`}

function drawInvite(e,ms,b,names,fmt,seed){
  FONTS_READY.then(()=>{
    const W=1080,H=fmt==='story'?1920:1350,c=OS.canvas(W,H),g=c.getContext('2d'),v=(seed-1)%3,P=pathOf(ms),sd=seedOf(e.id)+seed*977,tint=tintOf(P.x);
    g.fillStyle=INK;g.fillRect(0,0,W,H);
    const AH=fmt==='story'?1000:560,art=OS.canvas(W,AH),a=art.getContext('2d'),base=fragBase(e.x,LOOK[e.id],seedOf(e.id)),k=Math.max(W,AH)/480;
    a.drawImage(base,(W-480*k)/2,(AH-480*k)/2,480*k,480*k);
    const nm=((names||'').trim()||(ms.length>1||b.qty>1?'Для вас':'Для тебя')).toUpperCase();
    if(v===0){ // строгий 1 бит, имя повёрнуто на всю высоту
      OS.slices(a,{n:26,max:60,prob:.45,seed:sd});OS.dither(a,{algo:'floyd',scale:3,light:tint});
      OS.fitText(a,nm,{font:'"Oswald"',weight:700,x:W*.03,y:AH*.02,w:W*.26,h:AH*.96,rotate:-Math.PI/2,fill:FG});
    }else if(v===1){ // кислота: порог и розовые штрихи мелком
      OS.warp(a,{amp:8,freq:.02,noiseAmp:30,seed:sd});OS.duotone(a,{dark:INK,light:P.x>0?PINK:CYAN,threshold:avgLum(a)});
      OS.scribble(a,{x:W*.12,y:AH*.95,len:AH*.8,angle:-1.05,legs:7,spacing:W*.09,width:W*.07,color:P.x>0?RED:PINK,seed:sd});
    }else{ // ночной сбой
      OS.gradientMap(a,NIGHT,{bands:6});OS.streaks(a,{count:120,maxLen:W*.4,alpha:.55,seed:sd});OS.slices(a,{n:30,max:16,prob:.4,seed:sd});OS.rgbSplit(a,{dx:5});OS.halftone(a,{cell:8,angle:45,mix:.35});
    }
    g.drawImage(art,0,0);
    let y=AH+(fmt==='story'?110:80);
    g.fillStyle=MUTE;g.font='300 24px Unbounded, sans-serif';spaced(g,4);g.fillText('OBRAZ · ПРИГЛАШЕНИЕ',60,y);g.textAlign='right';g.fillText('№ '+String(sd%10000).padStart(4,'0'),W-60,y);g.textAlign='left';spaced(g,0);
    y+=30;
    const tc=OS.canvas(W,190),tg=tc.getContext('2d');tg.fillStyle=FG;
    if(v===2){const fs=fitFont(tg,nm,400,'Oranienbaum, serif',(W-120)/.78,170,60);tg.save();tg.translate(60,fs*.8);tg.scale(.78,1.15);tg.fillText(nm,0,0);tg.restore()}
    else{const fs=fitFont(tg,nm,700,'Oswald, sans-serif',W-120,170,60);tg.fillText(nm,60,fs*.92)}
    OS.slices(tg,{n:6,max:14,prob:.5,seed:sd%911});OS.rgbSplit(tg,{dx:4});g.drawImage(tc,0,y);
    y+=230;g.fillStyle=FG;g.font='italic 400 40px "Playfair Display", serif';g.fillText('на выставку',60,y);
    y+=62;g.font='600 44px "Golos Text", sans-serif';y=wrap(g,e.t,60,y,W-120,54);
    y+=48;g.fillStyle=MUTE;g.font='500 28px "Golos Text", sans-serif';y=wrap(g,e.v,60,y,W-120,38);
    y+=52;g.fillStyle=FG;g.font='300 26px Unbounded, sans-serif';spaced(g,3);g.fillText((fmtDay(days()[b.date])+(b.qty>1?' · '+b.qty+' билета':'')).toUpperCase(),60,y);
    g.fillRect(60,H-100,W-120,2);g.fillText(P.n.toUpperCase(),60,H-52);spaced(g,0);
    const el=document.getElementById('inv');if(el)el.src=c.toDataURL('image/jpeg',.9);
  });
}
