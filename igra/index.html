<style>
/* Layout: путеводитель = бумага (светлые страницы), игра = тёмный зал (чёрные экраны). Одна колонка, экраны меняются на месте.
   Система построена на фрагментации из постеров Алёны: срез, сдвиг полос, розовый и бирюзовый как сбитая приводка (тепло / холод). */
:root{
  --paper:#EDECE7; --paper2:#E3E1DA; --ink:#0E0E10; --ink2:#18181C; --graphite:#5B5B62; --rule:#CBC9C0;
  --onInk:#EDECE7; --onInkMute:#9C9CA4; --inkRule:#2C2C33;
  --pink:#F29AC4; --cyan:#21CFC2;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --text:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --surf:var(--paper); --fg:var(--ink); --mute:var(--graphite); --line:var(--rule);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--text);margin:0}
body.hall{background:var(--ink);color:var(--onInk);color-scheme:dark}
body.hall{--surf:var(--ink);--fg:var(--onInk);--mute:var(--onInkMute);--line:var(--inkRule)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surf);border-bottom:1px solid var(--line)}
.hd{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;gap:10px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font:800 17px/1 var(--display);letter-spacing:.18em;background:none;border:0;color:var(--fg);cursor:pointer;padding:4px 0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:500 12px/1 var(--mono);letter-spacing:.04em;padding:8px 10px;border-radius:0;background:transparent;color:var(--mute);border:0;border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--fg);border-bottom-color:var(--fg)}
nav button:disabled{opacity:.35;cursor:default}
nav button:hover{box-shadow:none!important;color:var(--fg)}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,60px);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(24px,3.6vw,38px)}
h3{font-size:18px;font-weight:500}
p{margin:0;max-width:62ch}
.lab{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{font:600 15px/1 var(--text);border-radius:0;padding:15px 22px;cursor:pointer;border:1.5px solid var(--fg);background:var(--fg);color:var(--surf);text-decoration:none;display:inline-flex;align-items:center;gap:10px}
button.ghost,.btn.ghost{background:transparent;color:var(--fg)}
button:hover:not(:disabled),.btn:hover{box-shadow:4px 0 0 var(--pink),-4px 0 0 var(--cyan)}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
section{padding-top:36px}
input[type=text]{font:500 16px var(--text);padding:12px 14px;border-radius:0;border:1.5px solid var(--line);background:transparent;color:var(--fg);width:100%;max-width:340px}
/* срез: фирменный приём — полоса заголовка сдвинута */
.cut{position:relative;display:inline-block}
.cut::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;height:100%;background:var(--surf);color:var(--fg);clip-path:inset(50% -2% 30% 0);transform:translateX(.05em);pointer-events:none;
  text-shadow:-.02em 0 0 var(--cyan),.02em 0 0 var(--pink)}
@media (prefers-reduced-motion:no-preference){.cut::after{animation:slip .9s cubic-bezier(.2,.8,.2,1) both}@keyframes slip{from{transform:translateX(0)}to{transform:translateX(.05em)}}}
/* фрагменты */
.frag{position:relative;display:block;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--paper2)}
.frag img{display:block;width:100%;height:100%;object-fit:cover}
.frag .ph{position:absolute;left:0;bottom:0;font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:5px 7px}
/* главная */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:end}
.hero .art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-self:stretch}
.hero .art .frag{aspect-ratio:auto;height:100%;min-height:240px}
.hero .art .frag:nth-child(2){transform:translateY(28px)}
.agg{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;border-top:1.5px solid var(--fg);border-bottom:1px solid var(--line);padding:10px 0;margin-top:40px;font:500 13px/1.4 var(--mono)}
.agg i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-right:6px;vertical-align:1px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:22px}
.how div{min-width:0;display:flex;flex-direction:column;gap:6px}
.how b{font:500 15px/1.25 var(--display)}
/* игра */
.game{min-height:calc(100vh - 140px);display:flex;flex-direction:column;gap:22px;padding-top:28px}
.turn{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dots{display:flex;gap:6px}.dots i{width:22px;height:3px;background:var(--inkRule)}.dots i.on{background:var(--onInk)}
.q{font:500 clamp(26px,4.2vw,44px)/1.1 var(--display);max-width:22ch;text-wrap:balance}
.thermo{height:min(46vh,380px);position:relative;overflow:hidden;border:1px solid var(--inkRule)}
.thermo .fld{position:absolute;inset:0;transition:background .2s}
.thermo .word{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:800 clamp(40px,9vw,110px)/1 var(--display);text-transform:uppercase;color:var(--ink);mix-blend-mode:normal}
.thermo .ends{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;gap:12px;font:500 12px/1.3 var(--mono);color:var(--ink)}
.slider{width:100%;accent-color:var(--onInk);height:34px}
.reel{height:min(40vh,300px);border:1px solid var(--inkRule);overflow:hidden;position:relative;background:var(--ink2)}
.reel .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel .cell{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font:800 clamp(34px,7vw,84px)/1 var(--display);text-transform:uppercase;text-align:center;padding:0 12px}
.reel .cell small{font:500 13px/1.3 var(--mono);text-transform:none;color:var(--onInkMute)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:22%;z-index:1;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--ink2),transparent)}.reel::after{bottom:0;background:linear-gradient(transparent,var(--ink2))}
.passed{font:500 13px/1.4 var(--mono);color:var(--onInkMute);min-height:1.4em}
.fan{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;perspective:1200px}
.card{position:relative;aspect-ratio:3/5;cursor:pointer;background:none;border:0;padding:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .3s,translate .3s}
.card:hover:not(:disabled){translate:0 -8px;box-shadow:none}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden}
.card .f{transform:rotateY(180deg)}
.card img{width:100%;height:100%;display:block}
.card.open{transform:rotateY(180deg)}
.card.dim{opacity:.18}
.fan.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:620px}
.card.kept{outline:2px solid var(--onInk);outline-offset:4px}
.wins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.win{padding:0;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--onInk);text-align:left;font:500 12px var(--mono)}
.win .frag{border:10px solid var(--ink2);outline:1px solid var(--inkRule)}
.win:hover .frag{outline-color:var(--onInk)}
.win:hover{box-shadow:none!important}
.shuffle{display:flex;align-items:center;justify-content:center;min-height:50vh;font:800 clamp(30px,6vw,64px)/1 var(--display);text-transform:uppercase}
/* путь */
.pathgrid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:44px;align-items:start}
.cardimg{width:100%;max-width:400px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px/1 var(--mono);padding:7px 10px;border:1px solid var(--line);color:var(--fg)}
.chip.w{border-color:var(--pink)}.chip.c{border-color:var(--cyan)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font:500 13px var(--mono)}
.axes{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.ax{display:grid;grid-template-columns:104px minmax(0,1fr) 104px;gap:10px;align-items:center;font:400 12px var(--mono);color:var(--mute)}
.ax span:first-child{text-align:right}
.ax .t{position:relative;height:1px;background:var(--line)}
.ax .t b{position:absolute;top:50%;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%)}
.ax .t b.o1{background:var(--pink)}.ax .t b.o2{background:var(--cyan)}.ax .t b.o3{background:#B98B2E}.ax .t b.o4{background:#7A6CF0}
.share{border:1.5px solid var(--fg);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.share input{max-width:none;font:500 13px var(--mono)}
.qr{background:#fff;padding:8px;width:146px;height:146px}
.qr img,.qr canvas{width:130px!important;height:130px!important}
/* остановки */
.stops{display:flex;flex-direction:column;margin-top:18px;border-top:1.5px solid var(--fg)}
.stop{display:grid;grid-template-columns:64px minmax(0,190px) minmax(0,1fr);gap:20px;padding:18px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);text-align:left;font:inherit;cursor:pointer;align-items:start}
.stop:hover{box-shadow:none!important;background:var(--paper2)}
.stop .n{font:800 34px/1 var(--display)}
.stop .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.stop .who{font:500 13px var(--mono)}
.more{margin-top:14px}
.pk{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);padding:6px 9px;background:var(--ink);color:var(--paper);align-self:flex-start}
.pk i{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:3px 0 0 var(--cyan)}
.stop.pkrow{cursor:default}.stop.pkrow:hover{background:none}
.stop .btn{align-self:flex-start;margin-top:6px;padding:12px 16px;font-size:14px}
.note{border:1.5px solid var(--fg);padding:14px 16px;display:flex;flex-direction:column;gap:6px;margin-top:22px}
/* выставка, билет, приглашение */
.ex{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:44px;align-items:start}
.why{border-left:3px solid var(--fg);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:8px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{background:transparent;color:var(--fg);border-color:var(--line);padding:10px 12px;font:500 13px var(--mono)}
.days button.sel{background:var(--fg);color:var(--surf);border-color:var(--fg)}
.qty{display:flex;align-items:center;gap:12px}.qty button{padding:9px 15px}
.reward{border:1.5px solid var(--fg);padding:18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(90deg,var(--pink) 0 4px,transparent 4px)}
.gift{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:44px;align-items:start}
.gift img{width:100%;display:block;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.seg{display:flex;border:1.5px solid var(--fg);width:max-content;max-width:100%}
.seg button{border:0;background:transparent;color:var(--fg);padding:10px 14px;font:500 13px var(--mono)}
.seg button.sel{background:var(--fg);color:var(--surf)}
.guide{border:1.5px solid var(--fg);padding:6px 18px 18px}
.trk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.trk button{padding:9px 12px;font-size:13px}
.trk.on .nm{text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:2px}
.prog{height:2px;background:var(--line);margin-top:6px}.prog i{display:block;height:100%;width:0;background:var(--fg)}
.lyr{font-size:15px;margin-top:14px;min-height:3em}
/* система */
.sys h2{margin-top:40px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.sw div{border:1px solid var(--rule);font:500 12px/1.4 var(--mono)}
.sw div i{display:block;height:74px}
.sw div span{display:block;padding:8px}
.spec{display:flex;flex-direction:column;gap:14px;margin-top:14px;border-top:1px solid var(--rule);padding-top:14px}
.rules{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.cards4 img{width:100%;display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;font:500 14px var(--text);z-index:9;box-shadow:3px 0 0 var(--pink),-3px 0 0 var(--cyan)}
footer{margin-top:64px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:10px}
footer p{max-width:82ch}
footer button{align-self:flex-start;padding:9px 12px;font:500 12px var(--mono)}
@media (max-width:820px){
  .hero,.pathgrid,.ex,.gift{grid-template-columns:1fr}
  .hero .art{order:-1}.hero .art .frag{min-height:150px}
  .how{grid-template-columns:1fr 1fr}
  .fan{grid-template-columns:repeat(4,minmax(0,1fr))}.fan.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stop{grid-template-columns:96px minmax(0,1fr);gap:14px;position:relative}
  .stop .n{position:absolute;left:0;top:18px;z-index:1;background:var(--ink);color:var(--paper);font-size:14px;padding:5px 6px}
  .stop .frag .ph{display:none}
  .share{grid-template-columns:1fr}
  .ax{grid-template-columns:78px minmax(0,1fr) 78px}
  .cards4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){.wins{grid-template-columns:1fr 1fr 1fr;gap:8px}.win .frag{border-width:5px}.how{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header><div class="hd">
  <button class="logo" id="logo" aria-label="На главную">OBRAZ</button>
  <span class="lab" style="color:var(--fg)">Игра · Пушкинская карта</span>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* ======================= данные ======================= */
// 7 визуальных осей (формула Алёны): цвет (температура, яркость, светлота), форма, плотность, симметрия, настроение
const AX=[
 {k:'temp',lo:'холодный',hi:'тёплый',loP:'холодные цвета',hiP:'тёплые цвета'},
 {k:'sat',lo:'приглушённый',hi:'яркий',loP:'приглушённый цвет',hiP:'яркий цвет'},
 {k:'light',lo:'тёмный',hi:'светлый',loP:'тёмные тона',hiP:'светлые тона'},
 {k:'form',lo:'угловатый',hi:'округлый',loP:'острые формы',hiP:'мягкие формы'},
 {k:'dens',lo:'минимализм',hi:'плотность',loP:'минимализм и воздух',hiP:'плотные композиции'},
 {k:'sym',lo:'асимметрия',hi:'симметрия',loP:'свободная асимметрия',hiP:'симметрия и порядок'},
 {k:'dyn',lo:'покой',hi:'движение',loP:'спокойствие',hiP:'движение'}];
const D=AX.length, TODAY=new Date('2026-10-15'), MAXP=5;
const ARTIFACT_URL='https://claude.ai/artifact/9bY4sMk6BQ1JmrSS46r3d5';
// выставки, которые в прототипе можно оплатить Пушкинской картой: государственные музеи и площадки. Частный музей «Дали и Пикассо» и центр «Марс» (спецпроект по карте закончился 31 августа) исключены. Перед защитой сверить с Госуслуги.Культура
const PK={pastel:1,musatov:1,kuzmin:1,xx:1,impr:1,star:1,phen:1,ludwig:1,turtle:1,paris:1,shito:1};
// Выставки Москвы, октябрь 2026 (по Яндекс Афише и сайтам площадок). В проекте этот список собирает агрегатор афиш.
const EX=[
 {id:'pastel',t:'Хрупкое искусство. Пастель из фондов графики XVIII — начала XX века',v:'Третьяковская галерея, Инженерный корпус',g:'tretyakov',d:'до 1 ноября',from:'2026-09-01',p:'от 500 ₽',x:[.4,-.5,.7,.7,-.2,.3,-.6],
  feel:'свет, который можно потрогать: пастель будто осела пыльцой на бумаге',about:'Пастель из фондов отдела графики: портреты, пейзажи, этюды. Мягкий пигмент, бархатная поверхность, свет внутри цвета.',
  look:['обратите внимание, как пастель держит свет: самые светлые места оставлены бумагой','найдите портрет, где цвет лица собран из холодных и тёплых штрихов','отойдите на два шага: размытые края собираются в форму']},
 {id:'musatov',t:'Виктор Борисов-Мусатов. Гармония образа',v:'Третьяковская галерея, Кадашёвская наб.',g:'tretyakov',d:'октябрь',from:'2026-09-01',p:'от 500 ₽',x:[-.4,-.4,.3,.8,.1,.2,-.5],
  feel:'вечер в старом саду, где всё выцвело до голубого и жемчужного',about:'Живопись Борисова-Мусатова: усадебные сцены, голубые и зелёные тона, плавные силуэты, ощущение сна.',
  look:['заметьте, как цвет почти выцветает: голубой, серо-зелёный, жемчужный','фигуры повторяют изгибы деревьев и прудов, формы перетекают друг в друга','постойте у одной работы подольше: движение в ней очень медленное']},

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const hueOf=tp=>tp<0?280+tp*70:(280+Math.min(125,tp*250))%360;
function palette(x){const [tp,sa,li]=x;return{h:hueOf(tp),s:12+(sa+1)/2*68,L:14+(li+1)/2*72}}

function computeProfile(items){
  const p=Array(D).fill(0),sw=items.reduce((a,i)=>a+i.w*Math.abs(i.r),0)||1;
  items.forEach(i=>i.x.forEach((v,k)=>p[k]+=i.w*i.r*v));
  for(let k=0;k<D;k++)p[k]=cl(p[k]/sw,-1,1);
  const W=items.reduce((a,i)=>a+i.w,0)||1, mr=items.reduce((a,i)=>a+i.w*i.r,0)/W;
  const w=AX.map((_,k)=>{const mx=items.reduce((a,i)=>a+i.w*i.x[k],0)/W;
    let c=0,vr=0,vx=0;items.forEach(i=>{const dr=i.r-mr,dx=i.x[k]-mx;c+=i.w*dr*dx;vr+=i.w*dr*dr;vx+=i.w*dx*dx});
    const corr=(vr&&vx)?c/Math.sqrt(vr*vx):0; return .15+1.6*Math.abs(corr)});
  return{p,w};
}
const pref=(x,P)=>Math.exp(-.2*x.reduce((a,v,k)=>a+P.w[k]*(v-P.p[k])**2,0));
const pathOf=P=>PATHS.map(a=>({a,v:pref(a.x,P)})).sort((a,b)=>b.v-a.v)[0].a;
// оценка = min(совпадений участников) − 0,25·повтор площадки + 0,05·новизна
function rank(people){
  const left=EX.map(e=>{const prs=people.map(P=>pref(e.x,P));return{e,prs,pr:Math.min(...prs),nov:Math.abs(TODAY-new Date(e.from))/864e5<=21?1:0}});
  const out=[],seen={};
  while(left.length){left.forEach(o=>{o.rep=seen[o.e.g]||0;o.sc=o.pr-.25*o.rep+.05*o.nov});left.sort((a,b)=>b.sc-a.sc);const o=left.shift();seen[o.e.g]=(seen[o.e.g]||0)+1;out.push(o)}
  return out;
}

function sources(P){
  const s=[];
  if(P.card!=null)s.push({lab:`по карте «${CARDS[P.card].n}»`,x:CARDS[P.card].x});
  if(P.wx!=null)s.push({lab:`по погоде «${WEATHER[P.wx].n.toLowerCase()}»`,x:WEATHER[P.wx].x});
  s.push({lab:P.p[0]>=0?'по выбору «тепло»':'по выбору «холод»',x:[Math.sign(P.p[0])||1,0,0,0,0,0,0]});

    return{a,k,pk,ok:same&&Math.sign(e.x[k])===Math.sign(pk),fit:Math.min(...people.map(P=>P.w[k]))*(1-Math.abs(e.x[k]-pk)/2)*Math.min(1,Math.abs(pk)*3)}})

// карта пути: таро-формат 2:3
function drawPathCard(ps,imgId){
  FONTS_READY.then(()=>{
    const W=1080,H=1620,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    const A=pathOf(ps.length>1?{p:ps[0].p.map((_,k)=>ps.reduce((a,P)=>a+P.p[k],0)/ps.length),w:ps[0].w.map((_,k)=>Math.min(...ps.map(P=>P.w[k])))}:ps[0]);
    const r=rng(seedOf(A.id+ps.map(P=>P.card).join()));
    g.fillStyle=C.ink;g.fillRect(0,0,W,H);
    // поле: полосы цвета вкуса + мотивы карт
    const bandTop=170,bandH=860;
    ps.forEach((P,i)=>{const pl=palette(P.p),x0=60+i*(W-120)/ps.length,w=(W-120)/ps.length;
      for(let y=bandTop;y<bandTop+bandH;){const h=6+r()*40;g.fillStyle=r()<.5?hsl(pl.h,pl.s,pl.L):hsl(pl.h+(P.p[0]>=0?20:-20),pl.s*.6,cl(pl.L+(r()-.5)*40,8,92));g.fillRect(x0,y,w,h);y+=h}});
    ps.forEach((P,i)=>{if(P.card==null)return;const w=(W-120)/ps.length,x0=60+i*w;g.save();g.translate(x0+w/2-180,bandTop+bandH/2-300);
      misreg(g,col=>{cardMotif(g,P.card,360,600,rng(7+i),col)},true,7);g.restore()});
    slice(g,60,bandTop,W-120,bandH,9,40,r);
    g.strokeStyle=C.paper;g.lineWidth=2;g.strokeRect(60,bandTop,W-120,bandH);
    g.fillStyle=C.paper;g.font='500 26px "IBM Plex Mono", monospace';g.fillText('OBRAZ · '+(ps.length>1?'ОБЩИЙ ПУТЬ':'ТВОЙ ПУТЬ'),60,110);
    g.textAlign='right';g.fillText('АРКАН '+A.r,W-60,110);g.textAlign='left';
    // название пути
    let fs=96;g.font=`800 ${fs}px Unbounded, sans-serif`;const words=A.n.toUpperCase().split(' ');
    const lines=[words[0]+' '+words[1],words.slice(2).join(' ')].filter(Boolean);
    while(lines.some(l=>g.measureText(l).width>W-120)&&fs>40){fs-=4;g.font=`800 ${fs}px Unbounded, sans-serif`}
    lines.forEach((l,i)=>g.fillText(l,60,bandTop+bandH+120+i*(fs+10)));
    const ty=bandTop+bandH+120+(lines.length-1)*(fs+10);
    shiftBand(g,40,ty-fs*.42,W-80,fs*.2,14,C.ink);
    g.fillStyle=C.onInkMute||'#9C9CA4';g.font='500 26px "IBM Plex Mono", monospace';
    const reads=ps.length>1?ps.map((P,i)=>(P.name||who(P,i))+(P.card!=null?' · '+CARDS[P.card].n:'')).join('   '):
      [ps[0].p[0]>=0?'тепло':'холод',ps[0].wx!=null?WEATHER[ps[0].wx].n.toLowerCase():null,ps[0].card!=null?'карта '+CARDS[ps[0].card].n:null].filter(Boolean).join(' · ');
    g.fillStyle='#9C9CA4';g.fillText(reads.slice(0,60),60,H-150);
    g.fillRect(60,H-110,W-120,2);g.fillStyle=C.paper;g.fillText('путеводитель по выставкам',60,H-60);
    const img=document.getElementById(imgId);if(img)img.src=c.toDataURL('image/png');
  });
}

function wrap(g,text,x,y,maxW,lh){const words=text.split(' ');let line='',yy=y;for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,yy);line=w;yy+=lh}else line=t}if(line)g.fillText(line,x,yy);return yy}
function drawInvite(e,ps,b,names,fmt,seed){
  FONTS_READY.then(()=>{
    const W=1080,H=fmt==='story'?1920:1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    const r=rng(seedOf(e.id)+seed*977),variant=(seed-1)%3,A=pathOf(ps[0]),pl=palette(ps[0].p);
    const im=new Image();im.onload=()=>{
      const dark=variant!==1;g.fillStyle=dark?C.ink:C.paper;g.fillRect(0,0,W,H);
      const fg=dark?C.paper:C.ink, mute=dark?'#9C9CA4':C.graph;
      const imgH=fmt==='story'?H*.5:H*.44;
      if(variant===0){ // полосы: фрагмент, нарезанный горизонтально
        for(let y=0;y<imgH;){const h=8+r()*60,dx=(r()-.5)*160;g.drawImage(im,0,y/imgH*im.height,im.width,h/imgH*im.height,dx,y+100,W,h);y+=h}
        g.globalCompositeOperation='screen';g.globalAlpha=.55;g.fillStyle=C.cyan;g.fillRect(0,100+imgH*r(),W,18);g.fillStyle=C.pink;g.fillRect(0,100+imgH*r(),W,30);g.globalAlpha=1;g.globalCompositeOperation='source-over';
      }else if(variant===1){ // окно: фрагмент в высоком окне, сбитая приводка
        const wx=W*.38,ww=W*.52,wy=90,wh=imgH+40;
        g.save();g.globalCompositeOperation='multiply';g.fillStyle=C.cyan;g.fillRect(wx-14,wy+10,ww,wh);g.fillStyle=C.pink;g.fillRect(wx+14,wy-10,ww,wh);g.restore();
        g.drawImage(im,wx,wy,ww,wh);slice(g,wx,wy,ww,wh,6,30,r);
        g.fillStyle=C.ink;for(let i=0;i<9;i++){const h=3+r()*12;g.fillRect(60,wy+i*(wh/9),wx-120,h)}
      }else{ // вертикальные срезы
        const cols=9,cw=W/cols;for(let i=0;i<cols;i++){const dy=(r()-.5)*180;g.drawImage(im,i/cols*im.width,0,im.width/cols,im.height,i*cw,100+dy,cw+1,imgH)}
        g.fillStyle=C.ink;g.fillRect(0,0,W,96);g.fillRect(0,100+imgH,W,H);
        g.fillStyle=hsl(pl.h,70,60,.9);g.fillRect(0,100+imgH-6,W,6);
      }
      g.fillStyle=fg;g.font='500 26px "IBM Plex Mono", monospace';g.fillText('OBRAZ · ПРИГЛАШЕНИЕ',60,62);g.textAlign='right';g.fillText('АРКАН '+A.r,W-60,62);g.textAlign='left';
      let y=100+imgH+(variant===1?170:110);
      const nm=(names||'').trim()||(ps.length>1||b.qty>1?'Для вас':'Для тебя');
      let fs=112;g.font=`800 ${fs}px Unbounded, sans-serif`;while(g.measureText(nm.toUpperCase()).width>W-120&&fs>44){fs-=4;g.font=`800 ${fs}px Unbounded, sans-serif`}
      g.fillStyle=fg;g.fillText(nm.toUpperCase(),60,y);
      shiftBand(g,40,y-fs*.45,W-80,fs*.18,r()>.5?14:-14,dark?C.ink:C.paper);
      y+=60;g.font='500 30px "IBM Plex Mono", monospace';g.fillStyle=mute;g.fillText('на выставку',60,y);
      y+=64;g.font='600 46px "Golos Text", sans-serif';g.fillStyle=fg;y=wrap(g,e.t,60,y,W-120,56);
      y+=60;g.font='500 30px "Golos Text", sans-serif';g.fillStyle=mute;y=wrap(g,e.v,60,y,W-120,40);
      y+=50;g.font='500 30px "IBM Plex Mono", monospace';g.fillStyle=fg;g.fillText(fmtDay(days()[b.date])+(b.qty>1?' · '+b.qty+' билета':''),60,y);
      g.fillStyle=fg;g.fillRect(60,H-110,W-120,2);g.font='500 26px "IBM Plex Mono", monospace';g.fillText(A.n.toLowerCase(),60,H-60);
      g.textAlign='right';g.fillText('№ '+String(seedOf(e.id+seed)%10000).padStart(4,'0'),W-60,H-60);g.textAlign='left';
      const el=document.getElementById('inv');if(el)el.src=c.toDataURL('image/png');
    };im.src=exImg(e);
  });
}
let utt=null,tick=null;
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}clearInterval(tick);utt=null}
function tracks(e){return[{n:'Вступление',t:`Добро пожаловать на выставку «${e.t}». ${e.about} Я проведу вас по трём остановкам. Не торопитесь, на каждую хватит пары минут.`},...e.look.map((l,i)=>({n:`Остановка ${i+1}`,t:cap(l)+'.'}))]}

  const e=exById(S.ex),T=tracks(e),b=S.bought[e.id];
  app.innerHTML=`<section class="ex">

        <div><div class="nm">${t.n}</div><div class="prog"><i id="pg${i}"></i></div></div><span class="lab">${Math.max(1,Math.round(t.t.length/14))} c</span></div>`).join('')}
        <p class="lyr" id="lyr">${esc(T[S.track].t)}</p></div>
      <p class="mute small">В прототипе текст читает синтезатор речи браузера. В проекте здесь голос куратора или автора выставки.</p>
    </div></section>${foot()}`;
  const playT=i=>{
    const was=utt&&S.track===i;stopAudio();app.querySelectorAll('.play').forEach(p=>p.textContent='▶');
    S.track=i;app.querySelectorAll('.trk').forEach(t=>t.classList.toggle('on',+t.dataset.i===i));document.getElementById('lyr').textContent=T[i].t;if(was)return;
    const btn=app.querySelector(`.play[data-i="${i}"]`);btn.textContent='❚❚';
    const dur=T[i].t.length/14*1000,start=Date.now(),bar=document.getElementById('pg'+i);
    tick=setInterval(()=>{const f=Math.min(1,(Date.now()-start)/dur);bar.style.width=f*100+'%';if(f>=1&&!('speechSynthesis' in window)){stopAudio();btn.textContent='▶'}},120);
    try{utt=new SpeechSynthesisUtterance(T[i].t);utt.lang='ru-RU';const v=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang));if(v)utt.voice=v;
      utt.onend=()=>{clearInterval(tick);bar.style.width='100%';btn.textContent='▶';utt=null;if(i<T.length-1)setTimeout(()=>playT(i+1),700)};speechSynthesis.speak(utt)}catch(err){utt={}}
  };
  app.querySelectorAll('.play').forEach(p=>p.onclick=()=>playT(+p.dataset.i));
  document.getElementById('back').onclick=()=>go('ex');wireFoot();
}
