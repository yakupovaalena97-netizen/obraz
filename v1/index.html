<style>
/* Layout: one column app; header with tabs (Тест · Профиль · Подборка · Вместе); each screen swaps in place */
:root{
  --bg:#1A0F22; --ink:#261732; --card:#33223F; --line:#4A3A57; --mute:#A497AE; --text:#E9E6D8; --sage:#AEA989; --sageInk:#1A0F22; --p2:#D59BC0;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#E9E6D8; --ink:#DDD9C6; --card:#F4F2E9; --line:#C9C3AB; --mute:#6A5C76; --text:#1A0F22; --sage:#4A3A57; --sageInk:#F4F2E9; --p2:#9A3F78; color-scheme:light}}
:root[data-theme="light"]{--bg:#E9E6D8; --ink:#DDD9C6; --card:#F4F2E9; --line:#C9C3AB; --mute:#6A5C76; --text:#1A0F22; --sage:#4A3A57; --sageInk:#F4F2E9; --p2:#9A3F78; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--f);margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.32em;font-size:18px;background:none;border:0;color:var(--text);cursor:pointer;padding:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:500 12px/1 var(--f);letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:99px;background:transparent;color:var(--mute);border:1px solid var(--line)}
nav button.on{border-color:var(--sage);color:var(--text)}
nav button:disabled{opacity:.35}
h1,h2,h3{font-weight:800;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.01em}
h2{font-size:clamp(24px,3.6vw,34px)}
h3{font-size:18px}
p{margin:0;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button,.btn{font:600 15px/1 var(--f);border-radius:4px;padding:14px 22px;cursor:pointer;border:1px solid var(--sage);background:var(--sage);color:var(--sageInk);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button.ghost,.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
button:hover,.btn:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
section{padding-top:36px}
input[type=text]{font:500 15px var(--f);padding:12px 14px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--text);width:100%;max-width:320px}
/* fragments */
.frag{position:relative;display:block;width:100%;aspect-ratio:1/1;max-width:100%;overflow:hidden;border-radius:2px;background:var(--card)}
.frag img{display:block;width:100%;height:100%;object-fit:cover}
.frag .ph{position:absolute;left:8px;bottom:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:3px 7px;border-radius:2px}
/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.hero .frags{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:44px}
.path div{border-top:1px solid var(--line);padding-top:12px;min-width:0}
.path b{display:block;margin-bottom:4px}
/* test */
.test{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:center}
.test .frag{box-shadow:0 18px 40px rgba(0,0,0,.35);transition:transform .35s ease,opacity .35s}
.test .frag.out{transform:translateX(-40px) rotate(-4deg);opacity:0}
.bar{height:3px;background:var(--line);margin-top:22px}.bar i{display:block;height:100%;background:var(--sage);transition:width .3s}
.slider{width:100%;accent-color:var(--sage);height:34px;margin-top:6px}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);gap:12px}
.verdict{font-size:22px;font-weight:600;min-height:1.5em}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:560px}
.pair button{padding:0;background:none;border:2px solid transparent;border-radius:3px;overflow:hidden;display:block}
.pair button:hover{border-color:var(--sage)}
/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:40px;align-items:start}
.axes{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.ax{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;gap:12px;align-items:center;font-size:13px}
.ax span:first-child{text-align:right;color:var(--mute)}.ax span:last-child{color:var(--mute)}
.ax .t{position:relative;height:2px;background:var(--line)}
.ax .t b{position:absolute;top:50%;border-radius:50%;background:var(--sage);transform:translate(-50%,-50%)}
.ax .t b.o2{background:var(--p2)}
.ax.strong span{color:var(--text)}
.cardimg{width:100%;max-width:380px;display:block;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.share{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.share input{max-width:none;font-size:13px}
.qr{background:#fff;padding:8px;border-radius:3px;width:146px;height:146px}
.qr img,.qr canvas{width:130px!important;height:130px!important}
/* picks */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:22px}
.pick{background:var(--card);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;cursor:pointer;text-align:left;color:var(--text);padding:0;font:inherit;min-width:0}
.pick:hover{border-color:var(--sage)}
.pick .im{position:relative}
.pick .frag{aspect-ratio:3/2;border-radius:0}
.pick .pct{position:absolute;top:10px;left:10px;background:var(--bg);color:var(--text);font-weight:800;font-size:13px;padding:5px 9px;border-radius:99px}
.pick .tx{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);border:1px solid var(--line);border-radius:99px;padding:3px 8px;margin-right:4px}
.who{font-size:13px;font-weight:600}
/* exhibition */
.ex{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:40px;align-items:start}
.why{background:var(--card);border:1px solid var(--line);padding:16px 18px;border-radius:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:transparent;color:var(--text);border-color:var(--line);padding:10px 14px;font-weight:500}
.chips button.sel{background:var(--sage);color:var(--sageInk);border-color:var(--sage)}
.qty{display:flex;align-items:center;gap:10px}.qty button{padding:8px 14px}
.guide{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:18px}
.trk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk button{padding:9px 12px;font-size:13px}
.trk.on .nm{color:var(--sage)}
.prog{height:2px;background:var(--line);margin-top:6px}.prog i{display:block;height:100%;width:0;background:var(--sage)}
.lyr{font-size:14px;margin-top:12px;min-height:3em}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps3 div{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:600;font-size:14px;z-index:9}
footer{margin-top:56px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--mute)}
footer p{max-width:80ch}
@media (max-width:760px){
  .hero,.test,.prof,.ex{grid-template-columns:1fr}
  .test .frag{max-width:320px;margin:0 auto}
  .path,.steps3{grid-template-columns:1fr}
  .ax{grid-template-columns:84px minmax(0,1fr) 84px}
  .share{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const hueOf=tp=>tp<0?280+tp*70:(280+Math.min(125,tp*250))%360;
function palette(x){const [tp,sa,li]=x;return{h:hueOf(tp),s:12+(sa+1)/2*68,L:14+(li+1)/2*72}}

    g.quadraticCurveTo(x0+Math.cos(ang+curve)*len/2,y0+Math.sin(ang+curve)*len/2,x0+Math.cos(ang)*len,y0+Math.sin(ang)*len);g.stroke()};

    case 'pastel':fill(hsl(h+20,s*.5,82));for(let i=0;i<700;i++)stroke(r()*N,r()*N,20+r()*50,-.9+r()*.5,6+r()*10,hsl(h+r()*80-40,s*.7,62+r()*28,.18+r()*.2),.3);break;

    case 'ink':fill('#F3EFE4');g.strokeStyle='rgba(30,25,30,.85)';for(let k=0;k<26;k++){let px=r()*N,py=r()*N;g.lineWidth=.6+r()*1.2;g.beginPath();g.moveTo(px,py);for(let j=0;j<8;j++){px+=r()*60-30;py+=r()*50-25;g.lineTo(px,py)}g.stroke()}
      for(let i=0;i<5;i++){g.fillStyle=hsl(pick([20,200,90]),40,60,.35);g.beginPath();g.ellipse(r()*N,r()*N,20+r()*50,10+r()*30,r()*3,0,7);g.fill()}break;
    case 'planes':fill('#EFE9DC');for(let i=0;i<9;i++){g.save();g.translate(r()*N,r()*N);g.rotate(-.6+r()*.4);g.fillStyle=pick(['#C8302A','#111','#2B4AA0','#E2B22B','#111']);
      r()<.2?(g.beginPath(),g.arc(0,0,20+r()*40,0,7),g.fill()):g.fillRect(-r()*120,-r()*30,40+r()*200,10+r()*50);g.restore()}break;
    case 'dabs':fill(hsl(h,s*.6,L));for(let i=0;i<1400;i++){g.fillStyle=hsl(h+r()*140-70,s+10,L+r()*40-15,.75);g.save();g.translate(r()*N,r()*N);g.rotate(r()*3);g.fillRect(0,0,10+r()*12,4+r()*5);g.restore()}break;

      g.lineWidth=10;g.strokeStyle='#111';for(let i=0;i<3;i++){g.fillStyle=pick([hsl(200,80,55),'#F7E04B','#fff',hsl(350,85,55)]);g.beginPath();g.ellipse(r()*N,r()*N,50+r()*80,40+r()*70,r(),0,7);g.fill();g.stroke()}break;

    case 'glow':fill(hsl(h,40,8));g.globalCompositeOperation='lighter';for(let i=0;i<7;i++){const X=r()*N,Y=r()*N,gr=g.createRadialGradient(X,Y,0,X,Y,90+r()*160);gr.addColorStop(0,hsl(h+r()*80-40,70,55,.55));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,N,N)}break;
    case 'cells':fill(hsl(h,s,L-15));for(let i=0;i<160;i++){const X=r()*N,Y=r()*N,R=8+r()*38,gr=g.createRadialGradient(X-R/3,Y-R/3,1,X,Y,R);gr.addColorStop(0,hsl(h+r()*60,s+20,L+25));gr.addColorStop(1,hsl(h+r()*60-30,s,L-25));g.fillStyle=gr;g.beginPath();g.arc(X,Y,R,0,7);g.fill()}break;
    case 'sepia':fill('#D9C7A4');for(let y=40;y<N;y+=26){g.fillStyle='rgba(80,55,30,.35)';g.fillRect(40+r()*20,y,180+r()*200,3)}g.strokeStyle='rgba(70,45,25,.8)';g.lineWidth=3;g.strokeRect(N*.55,N*.12,N*.35,N*.5);
      g.fillStyle='rgba(120,80,45,.5)';g.fillRect(N*.57,N*.14,N*.31,N*.46);break;
    case 'stitch':fill('#E8DFCC');{const cs=12,n=N/cs,half=n/2;const motif=[];for(let i=0;i<half;i++){motif[i]=[];for(let j=0;j<half;j++)motif[i][j]=r()<.35+.25*Math.sin(i*.9)*Math.cos(j*.9)?(r()<.7?0:1):-1}

}

/* ---------- формула Алёны ---------- */
function computeProfile(items){
  const p=Array(D).fill(0),sw=items.reduce((a,i)=>a+i.w*Math.abs(i.r),0)||1;
  items.forEach(i=>i.x.forEach((v,k)=>p[k]+=i.w*i.r*v));
  for(let k=0;k<D;k++)p[k]=cl(p[k]/sw,-1,1);
  const W=items.reduce((a,i)=>a+i.w,0), mr=items.reduce((a,i)=>a+i.w*i.r,0)/W;
  const w=AX.map((_,k)=>{const mx=items.reduce((a,i)=>a+i.w*i.x[k],0)/W;
    let c=0,vr=0,vx=0;items.forEach(i=>{const dr=i.r-mr,dx=i.x[k]-mx;c+=i.w*dr*dx;vr+=i.w*dr*dr;vx+=i.w*dx*dx});
    const corr=(vr&&vx)?c/Math.sqrt(vr*vx):0; return .15+1.6*Math.abs(corr)});
  return{p,w};
}
const pref=(x,P)=>Math.exp(-.2*x.reduce((a,v,k)=>a+P.w[k]*(v-P.p[k])**2,0));
// одна или несколько анкет: оценка = min(совпадений) − 0,25·повтор + 0,05·новизна
function rank(people){
  const left=EX.map(e=>{const prs=people.map(P=>pref(e.x,P));return{e,prs,pr:Math.min(...prs),nov:(TODAY-new Date(e.from))/864e5<=21?1:0}});
  const out=[],seen={};
  while(left.length){
    left.forEach(o=>{o.rep=seen[o.e.g]||0;o.sc=o.pr-.25*o.rep+.05*o.nov});
    left.sort((a,b)=>b.sc-a.sc);const o=left.shift();seen[o.e.g]=(seen[o.e.g]||0)+1;out.push(o);
  }
  return out;
}
function why(e,people){
  const many=people.length>1;
  const parts=AX.map((a,k)=>{const ps=people.map(P=>P.p[k]),same=ps.every(v=>Math.sign(v)===Math.sign(ps[0])&&Math.abs(v)>.08);
      const pk=ps.reduce((x,y)=>x+y,0)/ps.length,wk=Math.min(...people.map(P=>P.w[k]));
      return{a,k,pk,ok:same&&Math.sign(e.x[k])===Math.sign(pk),fit:wk*(1-Math.abs(e.x[k]-pk)/2)*Math.min(1,Math.abs(pk)*3)}})
    .filter(o=>o.ok).sort((a,b)=>b.fit-a.fit).slice(0,2);
  const pole=o=>o.pk>0?o.a.hiP:o.a.loP,list=parts.map(pole).join(' и ');
  let s;
  if(many)s=parts.length?`${people.length>2?'Вам всем':'Вам обоим'} близки ${list}, и в этой выставке этого много.`:'Здесь больше всего того, что у вас совпадает.';
  else{const tpl=[`Вам близки ${list}, и эта выставка построена на них.`,`Вы высоко оценили ${list}. Здесь этого много.`,`Совпадает с вашим вкусом: ${list}.`];
    s=parts.length?tpl[seedOf(e.id)%3]:'Выставка близка к вашему профилю сразу по нескольким осям.'}
  let m='';
  if(!many){const P=people[0],miss=AX.map((a,k)=>({a,k,d:Math.abs(e.x[k]-P.p[k])*P.w[k]})).sort((a,b)=>b.d-a.d)[0];
    if(miss.d>.9)m=` Здесь больше, чем вы привыкли: ${e.x[miss.k]>0?miss.a.hiP:miss.a.loP}. Это может стать открытием.`}
  return{s,m,tags:parts.map(o=>o.pk>0?o.a.hi:o.a.lo)};
}
function typeName(P){
  const o=AX.map((a,k)=>({a,k,v:P.p[k],imp:Math.abs(P.p[k])*P.w[k]})).sort((a,b)=>b.imp-a.imp);
  const adj={temp:['Холодный','Тёплый'],sat:['Тихий','Яркий'],light:['Ночной','Светлый'],form:['Острый','Мягкий'],dens:['Чистый','Насыщенный'],sym:['Свободный','Точный'],dyn:['Спокойный','Подвижный']};
  const noun={temp:['взгляд','взгляд'],sat:['созерцатель','колорист'],light:['наблюдатель','наблюдатель'],form:['конструктор','лирик'],dens:['минималист','собиратель'],sym:['импровизатор','архитектор'],dyn:['созерцатель','исследователь']};

function drawCard(people,names,sub){
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d'),dotC=['#AEA989','#D59BC0','#8FB3D9','#E3A36B','#B7D98F'];
  const draw=()=>{
    x.fillStyle='#1A0F22';x.fillRect(0,0,1080,1350);
    const sw=people.length===1?5:people.length,wd=(920-(sw-1)*16)/sw;
    for(let i=0;i<sw;i++){const P=people[people.length===1?0:i],pl=palette(P.p),shift=people.length===1?[0,30,-30,150,0][i]:0,lt=people.length===1?[0,12,-10,-4,30][i]:0;
      x.fillStyle=hsl(pl.h+shift,pl.s,cl(pl.L+lt,10,90));x.fillRect(80+i*(wd+16),250,wd,300);
      if(people.length>1){x.fillStyle=dotC[i];x.beginPath();x.arc(80+i*(wd+16)+24,274,12,0,7);x.fill()}}
    x.fillStyle='#E9E6D8';x.font='800 40px Montserrat, sans-serif';x.fillText('O B R A Z',80,140);
    x.fillStyle='#A497AE';x.font='500 28px Montserrat, sans-serif';x.fillText(sub,80,190);
    x.fillStyle='#E9E6D8';
    if(people.length===1){x.font='800 72px Montserrat, sans-serif';const w=names[0].split(' ');x.fillText(w[0],80,680);x.fillText(w.slice(1).join(' '),80,760)}
    else{x.font='800 36px Montserrat, sans-serif';names.forEach((n,i)=>{x.fillStyle=dotC[i];x.fillText(n,80,640+i*54)})}
    const maxw=Math.max(...people.flatMap(P=>P.w)),top=people.length===1?850:Math.max(850,640+people.length*54+40);
    AX.forEach((a,k)=>{const y=top+k*62;x.fillStyle='#4A3A57';x.fillRect(330,y,420,3);
      x.fillStyle='#A497AE';x.font='500 24px Montserrat, sans-serif';x.textAlign='right';x.fillText(a.lo,310,y+9);x.textAlign='left';x.fillText(a.hi,770,y+9);
      people.forEach((P,i)=>{x.fillStyle=dotC[i];x.globalAlpha=people.length>1?.85:1;x.beginPath();x.arc(330+(P.p[k]+1)/2*420,y+1,8+P.w[k]/maxw*12,0,7);x.fill();x.globalAlpha=1})});
    x.fillStyle='#A497AE';x.font='500 24px Montserrat, sans-serif';x.fillText('obraz · выставки Москвы',80,1300);
    const img=document.getElementById('cimg');if(img)img.src=c.toDataURL('image/png');
  };
  (document.fonts&&document.fonts.load)?document.fonts.load('800 40px Montserrat').then(draw,draw):draw();
}

    document.getElementById('lyr').textContent=T[i].t;if(was)return;
    const btn=app.querySelector(`.play[data-i="${i}"]`);btn.textContent='❚❚';
    const dur=T[i].t.length/14*1000,start=Date.now(),bar=document.getElementById('pg'+i);
    tick=setInterval(()=>{const f=Math.min(1,(Date.now()-start)/dur);bar.style.width=f*100+'%';if(f>=1&&!('speechSynthesis' in window)){stopAudio();btn.textContent='▶'}},120);
    try{utt=new SpeechSynthesisUtterance(T[i].t);utt.lang='ru-RU';utt.rate=1;
      const v=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang));if(v)utt.voice=v;
      utt.onend=()=>{clearInterval(tick);bar.style.width='100%';btn.textContent='▶';utt=null;if(i<T.length-1)setTimeout(()=>play(i+1),700)};
      speechSynthesis.speak(utt)}catch(err){utt={}}
  };
  app.querySelectorAll('.play').forEach(p=>p.onclick=()=>play(+p.dataset.i));
  document.getElementById('back').onclick=()=>go('ex');
  document.getElementById('more').onclick=()=>go(S.screenFrom==='together'?'together':'picks');
}
